name: Remote Dispatch Action Initiator
#test
on: [push]

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  ping-pong:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2.0.1
        with:
          token: ${{ secrets.t }}
          event-type: update
          repository: GaiaMod-Main/gaiamod-main.github.io
